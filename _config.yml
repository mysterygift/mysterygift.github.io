# Jekyll only builds the blog: blog.html and the posts in _posts/.
# Every other page is plain HTML with no front matter, so it is copied as is.
title: Albatross
description: No-nonsense production management.
url: https://mysterygift.github.io
lang: en-GB

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: false

plugins:
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope:
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
